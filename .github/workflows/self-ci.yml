name: CI
on:
  push: { branches: [main] }
  pull_request:
    # The release PR is opened by release-please with GITHUB_TOKEN. GitHub
    # creates a pull_request run for it but never schedules its jobs, and marks
    # the run failed the moment the PR merges - a red run that never executed
    # anything (every release since 0.3.1 carried one). Nothing gates on it:
    # the release branch is exempt from the approval ruleset and there are no
    # required status checks. The push to main after the squash merge runs
    # this same workflow on the merged result, and that is the run that counts.
    branches-ignore: ['release-please--**']
permissions: { contents: read }
concurrency:
  group: self-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: make check
  # Several cases in the suite compare a script here against the consumer's own
  # copy of it - resolve-version.sh, build-info.sh, and the App Review names the
  # fastlane lanes read. Without a consumer checkout every one of them skips, and
  # a skip reads as a pass in the summary, so the checks that exist to catch
  # cross-repo drift were in practice running against nothing. This job is what
  # makes them run.
  #
  # The template is a public repo, so the default token reaches it and no secret
  # is involved. Both steps below are hard: an unreachable sibling fails the job
  # rather than quietly reverting the suite to its skip branch and reporting
  # green - which is the very failure this job exists to prevent.
  parity:
    name: Parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Check out the consumer template
        uses: actions/checkout@v7
        with:
          repository: blinkbitcoin/react-native-mobile-template
          path: .template
          # Nothing here pushes, and the suite runs the template's own scripts.
          persist-credentials: false
      - uses: jdx/mise-action@v4
      # WORKFLOWS_CONSUMER_ROOT as well as WORKFLOWS_TEMPLATE_DIR: the first is what
      # consumer-contract.bats reads, the second what the parity cases read.
      # WORKFLOWS_PARITY_REQUIRED turns a would-be skip into a failure - see
      # parity_skip in test/test_helper.bash.
      - name: Run the suite against a real consumer
        env:
          WORKFLOWS_TEMPLATE_DIR: ${{ github.workspace }}/.template
          WORKFLOWS_CONSUMER_ROOT: ${{ github.workspace }}/.template
          WORKFLOWS_PARITY_REQUIRED: '1'
        run: mise exec -- bats test/

  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - env: { PR_TITLE: "${{ github.event.pull_request.title }}" }
        run: bash scripts/checks/commitlint.sh
