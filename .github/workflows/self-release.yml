name: Release
on:
  push:
    branches: [main]
concurrency:
  group: self-release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Job-level on purpose: a step's `if` cannot read that step's own env.
      HAVE_RELEASE_TAGGER_APP: ${{ secrets.RELEASE_TAGGER_APP_ID != '' && secrets.RELEASE_TAGGER_APP_PRIVATE_KEY != '' }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # Manifest mode namespaces every per-package output by its path. The bare
      # release_created above is the root package (the workflows themselves);
      # this one is the npm package, which releases on its own cadence.
      dev_config_released: ${{ steps.release.outputs['packages/dev-config--release_created'] }}
    steps:
      # A release PR opened with GITHUB_TOKEN gets a pull_request CI run that
      # GitHub creates but never gives a job, and marks failed the moment the
      # PR merges - a red run on every release since 0.3.1, executing nothing.
      # Nothing gates on it (the release branch is exempt from the approval
      # ruleset, no status check is required, and main's push run is the one
      # that counts), but it is noise on every release. A PR opened by a
      # GitHub App triggers CI like any other. The App is the one
      # github-release.yml already uses on the consumer side; with its two
      # secrets absent this step is skipped and release-please falls back to
      # GITHUB_TOKEN, exactly as before. Secrets cannot be read in `if`, so the
      # presence check goes through the job's env.
      - name: Mint an App token, so the release PR triggers CI
        id: app-token
        if: ${{ env.HAVE_RELEASE_TAGGER_APP == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_TAGGER_APP_ID }}
          private-key: ${{ secrets.RELEASE_TAGGER_APP_PRIVATE_KEY }}
      - name: Release please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # App token when the App is configured, else the explicit PAT, else
          # GITHUB_TOKEN. GitHub's `||` yields the first non-empty operand.
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLEASE_TOKEN || github.token }}

      # The publish job keys off a path-namespaced output, and a typo there
      # would make it skip silently rather than fail. Print what release-please
      # actually released so a wrong key is visible in the run, not months later
      # in a missing package version.
      - name: Record which packages released
        env:
          PATHS_RELEASED: ${{ steps.release.outputs.paths_released }}
        run: echo "paths_released=${PATHS_RELEASED:-none}" >> "$GITHUB_STEP_SUMMARY"
  major-tag:
    name: Major tag
    needs: release-please
    # Job outputs are strings and every non-empty string is truthy in a GitHub
    # expression, so a bare `outputs.release_created` also fires on the literal
    # "false" a no-release push produces - which would run tag-major.sh with an
    # empty TAG and leave main permanently red.
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Move the moving major/minor tags to this release
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: bash scripts/self/tag-major.sh

  publish-dev-config:
    name: Publish dev-config
    needs: release-please
    if: ${{ needs.release-please.outputs.dev_config_released == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write # publish @blinkbitcoin/dev-config to GitHub Packages
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # registry-url + scope write the .npmrc that routes @blinkbitcoin to
      # GitHub Packages, which is where the org's other @blinkbitcoin packages
      # live - so this needs github.token and no separate npm credential.
      - name: Set up Node and the @blinkbitcoin registry
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@blinkbitcoin'

      - name: Publish @blinkbitcoin/dev-config
        working-directory: packages/dev-config
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
