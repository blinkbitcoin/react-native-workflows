name: pr-closed
on:
  workflow_call: {}
  # The caller triggers this on `pull_request: [closed]` and grants
  # `permissions: actions: write` so the cancel step below can cancel runs.
permissions:
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      # No consumer checkout: cancel-runs.sh only calls the GitHub API with
      # data from the github context, so there is nothing to check the
      # consumer out for. The react-native-workflows checkout below is still
      # required by the shape rule that every job with a `run:` step checks
      # out .rnw. Setup never runs here (no $RNW), so the script is reached
      # through the plain .rnw/ checkout path, the same way checks.yml's
      # `changes` job reaches changed-class.sh.
      - name: Checkout react-native-workflows
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .rnw
          persist-credentials: false
      - name: Cancel in-flight runs for this PR's head sha
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash ".rnw/scripts/ci/cancel-runs.sh"
