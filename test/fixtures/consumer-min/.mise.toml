# Tool versions for the consumer fixture (mirrors the template's shape).
# scripts/ci/native-hash.sh folds this file's bytes into the native cache key,
# so a toolchain bump invalidates cached native builds.
[tools]
node = "24"
pnpm = "12"
java = "temurin-17"
ruby = "3.3"

[env]
EXPO_NO_TELEMETRY = "1"
